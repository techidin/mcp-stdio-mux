name: ci

on:
  pull_request:
  push:
    branches: [main, sandbox]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build ruff
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/mcp-stdio-mux --version
          /tmp/wheel-check/bin/python -c "from importlib import resources; assert (resources.files('mcp_stdio_mux') / 'SKILL.md').is_file()"
