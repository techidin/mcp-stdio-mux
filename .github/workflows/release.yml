name: release

# A merge to main is a release: the job publishes when __version__ is not on
# PyPI yet, then tags it and opens a GitHub release from CHANGELOG.md. A merge
# that does not bump the version publishes nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # the version tag and the GitHub release
      id-token: write  # PyPI trusted publishing; no token is stored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the version and check PyPI
        id: version
        run: |
          version=$(PYTHONPATH=src python -c "import mcp_stdio_mux; print(mcp_stdio_mux.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mcp-stdio-mux/$version/json")
          if [ "$status" = 200 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$version is already on PyPI; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a lagging PyPI cache must not fail the job
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "mcp-stdio-mux v$VERSION"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            awk -v heading="## $VERSION " 'index($0, heading) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
          fi
