[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mcp-stdio-mux"
dynamic = ["version"]
description = "One shared process per MCP server across every AI agent session, app and profile on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Muhyidin" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "ai-agents", "stdio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/techidin/mcp-stdio-mux"
Issues = "https://github.com/techidin/mcp-stdio-mux/issues"

[project.scripts]
mcp-stdio-mux = "mcp_stdio_mux.cli:main"

[tool.hatch.version]
path = "src/mcp_stdio_mux/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stdio_mux"]

[tool.hatch.build.targets.wheel.force-include]
"skills/mcp-stdio-mux/SKILL.md" = "mcp_stdio_mux/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
